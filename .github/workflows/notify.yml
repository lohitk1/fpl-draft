name: fpl-notify
# runs notify.py in the cloud
on:
  schedule:
    - cron: "*/20 * * * *"   # GitHub may delay this by several minutes
  workflow_dispatch:
    inputs:
      test:
        description: "send a test message and exit"
        type: boolean
        default: false
concurrency:
  group: fpl-notify${{ inputs.test && '-test' || '' }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.10" }
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: .cache/notify_state.json
          key: state-none
          restore-keys: state-
      - name: Test message
        if: ${{ inputs.test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py --test --no-toast
      - name: Run notifier
        if: ${{ !inputs.test }}
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: python3 notify.py --cloud --no-toast
      - name: Save state
        if: ${{ always() && !inputs.test }}
        uses: actions/cache/save@v4
        with:
          path: .cache/notify_state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}
